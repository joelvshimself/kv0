version: '3.8'

services:
  kv0-backend:
    build: ./backend
    container_name: kv0-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/kv0.db
      - PRE_DIP_NOTIFICATION_MINUTES=30
      - WAKE_NOTIFICATION_OFFSET_MINUTES=-15
    volumes:
      - ./data:/data
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
